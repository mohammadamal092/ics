<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Barang</title><link rel="stylesheet" href="../assets/css/style.css"></head><body data-page="barang-form" data-title="Edit Barang"><div id="navbar"></div><main class="container"><h1>Edit Barang</h1><div id="flash" hidden></div><form id="barangForm" class="form-card"><label>Kode Barang</label><input name="kode_barang" required autofocus><label>Nama Barang</label><input name="nama_barang" required><label>Kategori</label><select name="kategori_id"></select><label>Satuan</label><input name="satuan" required><label>Harga Beli</label><input name="harga_beli" type="number" step="0.01" min="0" required><label>Harga Jual</label><input name="harga_jual" type="number" step="0.01" min="0" required><label>Stok Saat Ini</label><input name="stok" type="number" disabled><label>Stok Minimum</label><input name="stok_minimum" type="number" min="0" required><div class="form-actions"><button class="btn btn-primary">Simpan Perubahan</button><a class="btn btn-secondary" href="index.html">Batal</a></div><p id="stok_help" class="auth-hint" hidden>Stok diubah melalui transaksi Barang Masuk/Keluar.</p></form></main><div id="footer"></div><script src="../assets/js/script.js"></script></body></html>
